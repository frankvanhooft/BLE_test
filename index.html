<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>ACE Test</h1>
        
        <!-- Action Buttons Control Panel -->
        <div class="control-panel">
            <button id="connectBtn" class="btn btn-connect">Connect Device</button>
            <button id="refreshBtn" class="btn btn-refresh" disabled>Refresh Data</button>
        </div>

        <!-- Connection Status Indicator -->
        <div id="statusStr" class="status-disconnected">Status: Disconnected</div>

        <!-- Metric Display Readout Grid -->
        <div class="telemetry-grid">
            <div class="card">
                <h3>Voltage</h3>
                <div class="value-display"><span id="voltValue">--.--</span> <span class="unit">V</span></div>
            </div>
            <div class="card">
                <h3>Current</h3>
                <div class="value-display"><span id="currValue">--.--</span> <span class="unit">A</span></div>
            </div>
            <div class="card">
                <h3>Temperature</h3>
                <div class="value-display"><span id="tempValue">--.--</span> <span class="unit">°C</span></div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
